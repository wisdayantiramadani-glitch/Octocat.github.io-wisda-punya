                    <i class="fa-solid fa-arrow-left"></i>
                    <span>Sebelumnya</span>
                </button>

                <button onclick="toggleGridModal(true)" class="px-4 py-2.5 rounded-xl bg-slate-800 border border-slate-700 text-slate-300 hover:bg-slate-700 font-medium text-sm flex items-center space-x-2 transition">
                    <i class="fa-solid fa-th-large"></i>
                    <span class="hidden sm:inline">Navigasi Soal</span>
                </button>

                <button id="btn-next" onclick="navigateQuestion(1)" class="px-5 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-sm flex items-center space-x-2 transition shadow-lg shadow-indigo-600/30">
                    <span id="btn-next-text">Berikutnya</span>
                    <i class="fa-solid fa-arrow-right"></i>
                </button>
            </div>
        </section>

        <!-- Question Grid Navigation Modal -->
        <div id="grid-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
