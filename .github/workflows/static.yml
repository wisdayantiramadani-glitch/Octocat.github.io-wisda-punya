                    <i class="fa-solid fa-volume-high" id="sound-icon"></i>
                </button>
                <button onclick="toggleTheme()" class="p-2.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white transition" title="Ganti Tema">
                    <i class="fa-solid fa-moon" id="theme-icon"></i>
                </button>
                <button onclick="showHighScores()" class="p-2.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-amber-400 hover:text-amber-300 transition" title="Papan Skor">
                    <i class="fa-solid fa-trophy"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
