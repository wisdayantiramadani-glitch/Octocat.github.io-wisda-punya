                        <i class="fa-solid fa-arrow-right ml-2"></i>
                    </div>
                </div>

                <!-- Survival Mode -->
                <div onclick="startQuiz('survival')" class="group relative bg-slate-800 hover:bg-slate-800/80 border border-slate-700 hover:border-rose-500/50 rounded-2xl p-6 cursor-pointer transition-all duration-300 hover:-translate-y-1 hover:shadow-xl hover:shadow-rose-500/10 flex flex-col justify-between">
                    <div>
                        <div class="w-12 h-12 rounded-xl bg-rose-500/10 border border-rose-500/30 text-rose-400 flex items-center justify-center text-xl mb-4 group-hover:scale-110 transition-transform">
                            <i class="fa-solid fa-heart-crack"></i>
                        </div>
                        <h3 class="text-lg font-bold text-white mb-2">Mode Survival</h3>
                        <p class="text-slate-400 text-xs leading-relaxed mb-4">
