                </div>

                <div class="pt-2 border-t border-slate-800 flex justify-end">
                    <button onclick="toggleGridModal(false)" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-lg text-sm font-medium">
                        Tutup
                    </button>
                </div>
            </div>
        </div>

        <!-- 3. RESULTS & REVIEW SCREEN -->
        <section id="results-screen" class="hidden space-y-8 py-4">
            <!-- Score Overview Header -->
            <div class="bg-slate-800/90 border border-slate-700 rounded-2xl p-6 md:p-8 text-center space-y-6 shadow-2xl relative overflow-hidden">
                <div class="absolute -right-10 -bottom-10 w-40 h-40 bg-indigo-500/10 rounded-full blur-2xl"></div>
                
                <div class="inline-flex items-center justify-center w-20 h-20 rounded-2xl bg-indigo-500/10 border border-indigo-500/30 text-indigo-400 text-3xl mb-2">
                    <i class="fa-solid fa-award" id="result-badge-icon"></i>
                </div>

                <div>
                    <h2 class="text-2xl md:text-3xl font-extrabold text-white mb-1" id="result-title">
                        Hasil Quiz Anda
                    </h2>
                    <p class="text-slate-400 text-sm" id="result-subtitle">
                        Berikut adalah rekapitulasi performa pengerjaan soal AI Coding.
                    </p>
                </div>

                <!-- Big Score Gauge -->
                <div class="flex justify-center items-center my-4">
                    <div class="relative flex items-center justify-center">
                        <div class="text-5xl md:text-6xl font-black bg-gradient-to-r from-indigo-400 to-cyan-400 bg-clip-text text-transparent font-mono" id="result-score">
                            0%
                        </div>
                    </div>
                </div>

                <!-- Metrics breakdown -->
                <div class="grid grid-cols-2 md:grid-cols-4 gap-4 max-w-2xl mx-auto pt-4 border-t border-slate-700/60 text-sm">
                    <div class="p-3 bg-slate-900/50 rounded-xl border border-slate-700/50">
                        <div class="text-emerald-400 font-bold text-lg" id="result-correct">0</div>
                        <div class="text-xs text-slate-400">Jawaban Benar</div>
                    </div>
                    <div class="p-3 bg-slate-900/50 rounded-xl border border-slate-700/50">
                        <div class="text-rose-400 font-bold text-lg" id="result-wrong">0</div>
                        <div class="text-xs text-slate-400">Jawaban Salah</div>
                    </div>
                    <div class="p-3 bg-slate-900/50 rounded-xl border border-slate-700/50">
                        <div class="text-amber-400 font-bold text-lg" id="result-streak">0</div>
                        <div class="text-xs text-slate-400">Max Streak</div>
                    </div>
                    <div class="p-3 bg-slate-900/50 rounded-xl border border-slate-700/50">
                        <div class="text-cyan-400 font-bold text-lg font-mono" id="result-time">00:00</div>
                        <div class="text-xs text-slate-400">Waktu Terpakai</div>
                    </div>
                </div>

                <!-- Action Buttons -->
                <div class="flex flex-wrap justify-center gap-3 pt-2">
                    <button onclick="restartQuiz()" class="px-5 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-sm flex items-center space-x-2 transition shadow-lg shadow-indigo-600/30">
                        <i class="fa-solid fa-rotate-right"></i>
                        <span>Coba Lagi</span>
                    </button>
                    <button onclick="scrollToReview()" class="px-5 py-2.5 rounded-xl bg-slate-700 hover:bg-slate-600 text-white font-semibold text-sm flex items-center space-x-2 transition">
                        <i class="fa-solid fa-list-check"></i>
                        <span>Lihat Pembahasan</span>
                    </button>
                    <button onclick="showScreen('welcome-screen')" class="px-5 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold text-sm flex items-center space-x-2 transition border border-slate-700">
                        <i class="fa-solid fa-house"></i>
                        <span>Menu Utama</span>
                    </button>
                </div>
            </div>

            <!-- Detailed Answer Review List -->
            <div id="review-section" class="space-y-4">
                <div class="flex items-center justify-between">
                    <h3 class="text-xl font-bold text-white flex items-center space-x-2">
                        <i class="fa-solid fa-book-open text-indigo-400"></i>
                        <span>Pembahasan Lengkap 35 Soal</span>
                    </h3>
                    <span class="text-xs text-slate-400">Kunci Jawaban & Penjelasan</span>
                </div>

                <div id="review-list-container" class="space-y-4">
                    <!-- Review Item template generated in JS -->
                </div>
            </div>
        </section>

        <!-- High Score / Leaderboard Modal -->
        <div id="highscore-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
            <div class="bg-slate-900 border border-slate-700 rounded-2xl w-full max-w-md p-6 space-y-4 shadow-2xl">
                <div class="flex justify-between items-center">
                    <h3 class="text-lg font-bold text-white flex items-center space-x-2">
                        <i class="fa-solid fa-trophy text-amber-400"></i>
                        <span>Papan Skor & Catatan Rekor</span>
                    </h3>
                    <button onclick="toggleModal('highscore-modal', false)" class="text-slate-400 hover:text-white p-1">
                        <i class="fa-solid fa-xmark text-xl"></i>
                    </button>
                </div>

                <div id="highscore-list" class="space-y-3 py-2 max-h-60 overflow-y-auto custom-scrollbar">
                    <!-- Scores list -->
                </div>

                <div class="pt-2 border-t border-slate-800 flex justify-between items-center">
                    <button onclick="clearHighScores()" class="text-xs text-rose-400 hover:underline">
                        Hapus Rekor
                    </button>
                    <button onclick="toggleModal('highscore-modal', false)" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-lg text-sm font-medium">
                        Tutup
                    </button>
                </div>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="border-t border-slate-800 py-4 text-center text-xs text-slate-500">
        <p>AI Coding Quiz App &bull; Powered by HTML5, Tailwind CSS & JS</p>
    </footer>

    <script>
        // Complete 35 Questions Dataset with Categories and Explanations
        const questionsData = [
            {
                id: 1,
                question: "Apa kepanjangan dari \"AI\"?",
                options: [
                    "Automatic Interface",
                    "Artificial Intelligence",
                    "Applied Information",
                    "Algorithm Input"
                ],
                answer: 1,
                category: "Konsep Dasar AI",
                explanation: "AI singkatan dari Artificial Intelligence (Kecerdasan Buatan), yaitu bidang ilmu komputer yang bertujuan membuat sistem mampu meniru kecerdasan manusia."
            },
            {
                id: 2,
                question: "Bahasa pemrograman yang paling populer untuk Coding AI adalah...",
                options: [
                    "Java",
                    "C++",
                    "Python",
                    "HTML"
                ],
                answer: 2,
                category: "Bahasa Pemrograman",
                explanation: "Python adalah bahasa paling populer untuk AI karena sintaksnya yang simpel serta ekosistem library AI/ML yang sangat kaya seperti TensorFlow, PyTorch, dan Scikit-Learn."
            },
