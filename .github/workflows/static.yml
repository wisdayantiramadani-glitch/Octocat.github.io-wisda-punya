                <div class="flex justify-between items-center">
                    <h3 class="text-lg font-bold text-white flex items-center space-x-2">
                        <i class="fa-solid fa-list-ol text-indigo-400"></i>
                        <span>Navigasi Nomor Soal</span>
                    </h3>
                    <button onclick="toggleGridModal(false)" class="text-slate-400 hover:text-white p-1">
                        <i class="fa-solid fa-xmark text-xl"></i>
                    </button>
                </div>
                <p class="text-xs text-slate-400">
                    Klik nomor untuk melompat ke soal tersebut. Warna menandakan status pengerjaan.
                </p>
                <div class="flex flex-wrap gap-2 text-xs mb-2">
                    <span class="flex items-center space-x-1"><span class="w-3 h-3 rounded bg-indigo-600 inline-block"></span> <span>Terjawab</span></span>
                    <span class="flex items-center space-x-1"><span class="w-3 h-3 rounded bg-slate-800 border border-slate-600 inline-block"></span> <span>Belum</span></span>
                    <span class="flex items-center space-x-1"><span class="w-3 h-3 rounded bg-amber-500 inline-block"></span> <span>Ditandai</span></span>
                </div>
                
                <div id="question-grid" class="grid grid-cols-5 sm:grid-cols-7 gap-2 max-h-60 overflow-y-auto custom-scrollbar p-1">
