        // State Management Variables
        let currentMode = 'practice'; // 'practice', 'exam', 'survival'
        let currentQuestionIdx = 0;
        let userAnswers = new Array(questionsData.length).fill(null);
        let bookmarkedQuestions = new Set();
        let lives = 3;
        let currentStreak = 0;
        let maxStreak = 0;
        let soundEnabled = true;
        let timerInterval = null;
        let timeElapsedSeconds = 0;
        const totalExamTimeSeconds = 25 * 60; // 25 minutes
        let isDarkMode = true;

        // Web Audio Synthesizer for sound effects
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (!soundEnabled) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                const now = audioCtx.currentTime;

                if (type === 'correct') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(523.25, now); // C5
                    osc.frequency.exponentialRampToValueAtTime(659.25, now + 0.1); // E5
                    osc.frequency.exponentialRampToValueAtTime(783.99, now + 0.2); // G5
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
                    osc.start(now);
                    osc.stop(now + 0.35);
                } else if (type === 'wrong') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(220, now); // A3
                    osc.frequency.exponentialRampToValueAtTime(146.83, now + 0.2); // D3
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                    osc.start(now);
                    osc.stop(now + 0.3);
                } else if (type === 'click') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(400, now);
                    gain.gain.setValueAtTime(0.1, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
                    osc.start(now);
                    osc.stop(now + 0.05);
                } else if (type === 'finish') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(523.25, now);
                    osc.frequency.setValueAtTime(659.25, now + 0.15);
                    osc.frequency.setValueAtTime(783.99, now + 0.3);
                    osc.frequency.setValueAtTime(1046.50, now + 0.45);
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.8);
                    osc.start(now);
                    osc.stop(now + 0.8);
                }
            } catch (e) {
                console.log("Audio play error", e);
            }
        }

        // DOM Ready Initializations
        window.addEventListener('DOMContentLoaded', () => {
            loadStatsFromStorage();
            updateWelcomeStats();
        });

        function showScreen(screenId) {
            playSound('click');
            ['welcome-screen', 'quiz-screen', 'results-screen'].forEach(id => {
                document.getElementById(id).classList.add('hidden');
            });
            document.getElementById(screenId).classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function toggleTheme() {
            isDarkMode = !isDarkMode;
            const html = document.documentElement;
            const icon = document.getElementById('theme-icon');
            if (isDarkMode) {
                html.classList.add('dark');
                icon.className = 'fa-solid fa-moon';
            } else {
                html.classList.remove('dark');
                icon.className = 'fa-solid fa-sun';
            }
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            const icon = document.getElementById('sound-icon');
            if (soundEnabled) {
                icon.className = 'fa-solid fa-volume-high';
            } else {
                icon.className = 'fa-solid fa-volume-xmark';
            }
        }

        // Quiz Initialization
        function startQuiz(mode) {
            currentMode = mode;
            currentQuestionIdx = 0;
            userAnswers = new Array(questionsData.length).fill(null);
            bookmarkedQuestions.clear();
            lives = 3;
            currentStreak = 0;
            maxStreak = 0;
            timeElapsedSeconds = 0;

            // Configure Mode HUD
            const timerContainer = document.getElementById('timer-container');
            const livesContainer = document.getElementById('lives-container');
            const streakContainer = document.getElementById('streak-container');

            timerContainer.classList.add('hidden');
            livesContainer.classList.add('hidden');
            streakContainer.classList.remove('hidden');

            if (mode === 'exam') {
                timerContainer.classList.remove('hidden');
                startTimer();
            } else if (mode === 'survival') {
                livesContainer.classList.remove('hidden');
                document.getElementById('lives-count').innerText = lives;
            }

            updateStreakDisplay();
            showScreen('quiz-screen');
            renderQuestion();
        }

        function startTimer() {
            clearInterval(timerInterval);
            let timeRemaining = totalExamTimeSeconds;
            
            const timerDisplay = document.getElementById('timer-display');
            
            timerInterval = setInterval(() => {
                timeElapsedSeconds++;
                timeRemaining--;

                const mins = Math.floor(timeRemaining / 60);
                const secs = timeRemaining % 60;
                timerDisplay.innerText = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;

                if (timeRemaining <= 0) {
                    clearInterval(timerInterval);
                    finishQuiz();
                }
            }, 1000);
        }

        // Question Rendering
        function renderQuestion() {
            const q = questionsData[currentQuestionIdx];

            // Badge updates
            document.getElementById('question-badge').innerText = `Soal ${currentQuestionIdx + 1} / ${questionsData.length}`;
            document.getElementById('category-badge').innerText = q.category;

            // Progress bar
            const progressPercent = ((currentQuestionIdx + 1) / questionsData.length) * 100;
            document.getElementById('progress-bar').style.width = `${progressPercent}%`;

            // Question Text
            document.getElementById('question-text').innerText = `${q.id}. ${q.question}`;

            // Bookmark icon status
            updateBookmarkIcon();

            // Options rendering
            const container = document.getElementById('options-container');
            container.innerHTML = '';

            const letters = ['A', 'B', 'C', 'D'];
            const userAns = userAnswers[currentQuestionIdx];

            q.options.forEach((opt, idx) => {
                const optBtn = document.createElement('button');
                optBtn.className = `w-full text-left p-4 rounded-xl border flex items-center space-x-3 transition-all duration-200 group text-sm md:text-base `;

                let borderStyle = 'border-slate-700 bg-slate-900/60 hover:bg-slate-700/60 hover:border-indigo-500/50';
                let letterStyle = 'bg-slate-800 text-slate-300 border-slate-700 group-hover:bg-indigo-600 group-hover:text-white';

                // Check selected or practice mode state
                if (userAns !== null) {
                    if (currentMode === 'practice') {
                        if (idx === q.answer) {
                            borderStyle = 'border-emerald-500 bg-emerald-500/10 text-emerald-300 font-semibold';
                            letterStyle = 'bg-emerald-500 text-white border-emerald-400';
                        } else if (idx === userAns && userAns !== q.answer) {
                            borderStyle = 'border-rose-500 bg-rose-500/10 text-rose-300 font-semibold';
                            letterStyle = 'bg-rose-500 text-white border-rose-400';
                        } else {
                            borderStyle = 'border-slate-800 bg-slate-900/40 opacity-50';
                        }
                    } else {
                        // Exam or Survival mode selected state
                        if (idx === userAns) {
                            borderStyle = 'border-indigo-500 bg-indigo-500/20 text-white font-semibold shadow-lg shadow-indigo-500/10';
                            letterStyle = 'bg-indigo-600 text-white border-indigo-400';
                        }
                    }
                }

                optBtn.className += borderStyle;

                optBtn.innerHTML = `
                    <span class="w-8 h-8 rounded-lg border text-xs font-bold flex items-center justify-center shrink-0 transition-colors ${letterStyle}">
                        ${letters[idx]}
                    </span>
                    <span class="flex-1 leading-snug">${opt}</span>
                    ${userAns !== null && currentMode === 'practice' && idx === q.answer ? '<i class="fa-solid fa-circle-check text-emerald-400 text-lg"></i>' : ''}
                    ${userAns !== null && currentMode === 'practice' && idx === userAns && userAns !== q.answer ? '<i class="fa-solid fa-circle-xmark text-rose-400 text-lg"></i>' : ''}
                `;

                optBtn.onclick = () => selectOption(idx);
                container.appendChild(optBtn);
            });

            // Handle Practice Mode Explanation Box
            const explanationBox = document.getElementById('explanation-box');
            if (currentMode === 'practice' && userAns !== null) {
                explanationBox.classList.remove('hidden');
                const isCorrect = userAns === q.answer;

                const statusEl = document.getElementById('explanation-status');
                const iconEl = document.getElementById('explanation-icon');
                const textEl = document.getElementById('explanation-text');

                if (isCorrect) {
                    explanationBox.className = 'p-4 rounded-xl border border-emerald-500/30 bg-emerald-950/20 text-emerald-300';
                    statusEl.innerText = "Jawaban Benar!";
                    iconEl.className = "fa-solid fa-circle-check text-emerald-400";
                } else {
                    explanationBox.className = 'p-4 rounded-xl border border-rose-500/30 bg-rose-950/20 text-rose-300';
                    statusEl.innerText = `Jawaban Kurang Tepat! Kunci: (${letters[q.answer]})`;
                    iconEl.className = "fa-solid fa-circle-xmark text-rose-400";
                }
                textEl.innerText = q.explanation;
            } else {
                explanationBox.classList.add('hidden');
            }

            // Update Navigation Buttons
            document.getElementById('btn-prev').disabled = currentQuestionIdx === 0;

            const btnNextText = document.getElementById('btn-next-text');
            if (currentQuestionIdx === questionsData.length - 1) {
                btnNextText.innerText = "Selesai Quiz";
            } else {
                btnNextText.innerText = "Berikutnya";
            }
        }

        function selectOption(idx) {
            if (userAnswers[currentQuestionIdx] !== null && currentMode === 'practice') {
                return; // Prevent changing in practice mode once answered
            }

            const q = questionsData[currentQuestionIdx];
            const isCorrect = idx === q.answer;

            userAnswers[currentQuestionIdx] = idx;

            if (isCorrect) {
                playSound('correct');
                currentStreak++;
                if (currentStreak > maxStreak) maxStreak = currentStreak;
            } else {
                playSound('wrong');
                currentStreak = 0;

                if (currentMode === 'survival') {
                    lives--;
                    document.getElementById('lives-count').innerText = lives;
                    if (lives <= 0) {
                        setTimeout(() => {
                            finishQuiz();
                        }, 500);
                        return;
                    }
                }
            }

            updateStreakDisplay();
            renderQuestion();
        }

        function updateStreakDisplay() {
            document.getElementById('streak-count').innerText = currentStreak;
            const container = document.getElementById('streak-container');
            if (currentStreak >= 2) {
                container.classList.remove('hidden');
            } else if (currentMode !== 'practice') {
                container.classList.add('hidden');
            }
        }

        function navigateQuestion(dir) {
            playSound('click');
            const targetIdx = currentQuestionIdx + dir;

            if (targetIdx >= questionsData.length) {
                finishQuiz();
                return;
            }

            if (targetIdx >= 0 && targetIdx < questionsData.length) {
                currentQuestionIdx = targetIdx;
                renderQuestion();
            }
        }

        function toggleBookmarkCurrent() {
            playSound('click');
            if (bookmarkedQuestions.has(currentQuestionIdx)) {
                bookmarkedQuestions.delete(currentQuestionIdx);
            } else {
                bookmarkedQuestions.add(currentQuestionIdx);
            }
            updateBookmarkIcon();
        }

        function updateBookmarkIcon() {
            const icon = document.getElementById('bookmark-icon');
            const btn = document.getElementById('bookmark-btn');
            if (bookmarkedQuestions.has(currentQuestionIdx)) {
                icon.className = "fa-solid fa-bookmark text-amber-400";
                btn.title = "Hapus tanda soal";
            } else {
                icon.className = "fa-regular fa-bookmark text-slate-400";
                btn.title = "Tandai soal ini";
            }
        }

        function toggleGridModal(show) {
            playSound('click');
            const modal = document.getElementById('grid-modal');
            if (show) {
                renderGridItems();
                modal.classList.remove('hidden');
            } else {
                modal.classList.add('hidden');
            }
        }

        function renderGridItems() {
            const grid = document.getElementById('question-grid');
            grid.innerHTML = '';

            questionsData.forEach((_, idx) => {
                const item = document.createElement('button');
                item.className = 'w-10 h-10 rounded-lg text-xs font-bold transition flex items-center justify-center relative ';

                const isAnswered = userAnswers[idx] !== null;
                const isBookmarked = bookmarkedQuestions.has(idx);
                const isCurrent = idx === currentQuestionIdx;

                if (isCurrent) {
                    item.className += 'ring-2 ring-indigo-400 ring-offset-2 ring-offset-slate-900 ';
                }

                if (isBookmarked) {
                    item.className += 'bg-amber-500 text-slate-950 font-extrabold ';
                } else if (isAnswered) {
                    item.className += 'bg-indigo-600 text-white ';
                } else {
                    item.className += 'bg-slate-800 text-slate-300 hover:bg-slate-700 border border-slate-700 ';
                }

                item.innerText = idx + 1;
                item.onclick = () => {
                    currentQuestionIdx = idx;
                    toggleGridModal(false);
                    renderQuestion();
                };
                grid.appendChild(item);
            });
        }

        function finishQuiz() {
            clearInterval(timerInterval);
            playSound('finish');

            // Calculate results
            let correctCount = 0;
            userAnswers.forEach((ans, idx) => {
                if (ans === questionsData[idx].answer) {
                    correctCount++;
                }
            });

            const wrongCount = userAnswers.filter((ans, i) => ans !== null && ans !== questionsData[i].answer).length;
            const percentage = Math.round((correctCount / questionsData.length) * 100);

            // Trigger Confetti for high score
            if (percentage >= 70) {
                confetti({
                    particleCount: 100,
                    spread: 70,
                    origin: { y: 0.6 }
                });
            }

            // Update Score Screen
            document.getElementById('result-score').innerText = `${percentage}%`;
            document.getElementById('result-correct').innerText = correctCount;
            document.getElementById('result-wrong').innerText = wrongCount;
            document.getElementById('result-streak').innerText = `${maxStreak}x`;

            const mins = Math.floor(timeElapsedSeconds / 60);
            const secs = timeElapsedSeconds % 60;
            document.getElementById('result-time').innerText = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;

            // Title and badge icon based on score
            const titleEl = document.getElementById('result-title');
            const badgeIcon = document.getElementById('result-badge-icon');

            if (percentage === 100) {
                titleEl.innerText = "Sempurna! AI Master! 🏆";
                badgeIcon.className = "fa-solid fa-crown text-amber-400";
            } else if (percentage >= 80) {
                titleEl.innerText = "Luar Biasa! Pemahaman AI Sangat Tinggi! 🔥";
                badgeIcon.className = "fa-solid fa-medal text-cyan-400";
            } else if (percentage >= 60) {
                titleEl.innerText = "Bagus! Teruskan Latihan Coding AI! 👍";
                badgeIcon.className = "fa-solid fa-award text-indigo-400";
            } else {
                titleEl.innerText = "Jangan Patah Semangat! Pelajari Pembahasannya 📚";
                badgeIcon.className = "fa-solid fa-book-open text-rose-400";
            }

            saveScoreToStorage(percentage, correctCount);
            renderReviewList();
            showScreen('results-screen');
        }

        function restartQuiz() {
            startQuiz(currentMode);
        }

        function scrollToReview() {
            document.getElementById('review-section').scrollIntoView({ behavior: 'smooth' });
        }

        function renderReviewList() {
            const container = document.getElementById('review-list-container');
            container.innerHTML = '';

            const letters = ['A', 'B', 'C', 'D'];

            questionsData.forEach((q, idx) => {
                const userAns = userAnswers[idx];
                const isCorrect = userAns === q.answer;

                const card = document.createElement('div');
                card.className = `p-5 rounded-xl border bg-slate-800/80 space-y-3 ${
                    userAns === null ? 'border-slate-700' :
                    isCorrect ? 'border-emerald-500/40 bg-emerald-950/10' : 'border-rose-500/40 bg-rose-950/10'
                }`;

                let statusBadge = `<span class="px-2.5 py-0.5 rounded-full text-xs font-bold bg-slate-700 text-slate-300">Belum Dijawab</span>`;
                if (userAns !== null) {
                    if (isCorrect) {
                        statusBadge = `<span class="px-2.5 py-0.5 rounded-full text-xs font-bold bg-emerald-500/20 text-emerald-400 border border-emerald-500/30"><i class="fa-solid fa-check mr-1"></i> Benar</span>`;
                    } else {
                        statusBadge = `<span class="px-2.5 py-0.5 rounded-full text-xs font-bold bg-rose-500/20 text-rose-400 border border-rose-500/30"><i class="fa-solid fa-xmark mr-1"></i> Salah</span>`;
                    }
                }

                card.innerHTML = `
                    <div class="flex items-start justify-between gap-2">
                        <h4 class="font-semibold text-white text-base leading-snug">
                            ${q.id}. ${q.question}
                        </h4>
                        ${statusBadge}
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 text-xs pt-1">
                        ${q.options.map((opt, oIdx) => {
                            let optClass = 'bg-slate-900/60 border-slate-700 text-slate-300';
                            if (oIdx === q.answer) {
                                optClass = 'bg-emerald-500/20 border-emerald-500/50 text-emerald-300 font-bold';
                            } else if (oIdx === userAns && !isCorrect) {
                                optClass = 'bg-rose-500/20 border-rose-500/50 text-rose-300 line-through';
                            }
                            return `
                                <div class="p-2.5 rounded-lg border flex items-center space-x-2 ${optClass}">
                                    <span class="font-bold uppercase">${letters[oIdx]}.</span>
                                    <span>${opt}</span>
                                </div>
                            `;
                        }).join('')}
                    </div>

                    <div class="p-3 bg-slate-900/80 rounded-lg border border-slate-700/60 text-xs text-slate-300 space-y-1">
                        <div class="font-bold text-indigo-400 flex items-center space-x-1">
                            <i class="fa-solid fa-lightbulb"></i>
                            <span>Pembahasan Kunci Jawaban:</span>
                        </div>
                        <p class="leading-relaxed text-slate-300">${q.explanation}</p>
                    </div>
                `;

                container.appendChild(card);
            });
        }

        function saveScoreToStorage(score, correctCount) {
            try {
                let history = JSON.parse(localStorage.getItem('ai_quiz_scores') || '[]');
                history.push({
                    date: new Date().toLocaleDateString('id-ID', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }),
                    score: score,
                    correct: correctCount,
                    mode: currentMode
                });
                history.sort((a, b) => b.score - a.score);
                history = history.slice(0, 10); // keep top 10
                localStorage.setItem('ai_quiz_scores', JSON.stringify(history));
                
                // Total completed counter
                let completed = parseInt(localStorage.getItem('ai_quiz_completed') || '0') + 1;
                localStorage.setItem('ai_quiz_completed', completed.toString());

                updateWelcomeStats();
            } catch (e) {
                console.log("LocalStorage save error", e);
            }
        }

        function loadStatsFromStorage() {
            updateWelcomeStats();
        }

        function updateWelcomeStats() {
            try {
                const history = JSON.parse(localStorage.getItem('ai_quiz_scores') || '[]');
                const highest = history.length > 0 ? history[0].score : 0;
                const totalCompleted = localStorage.getItem('ai_quiz_completed') || '0';

                document.getElementById('stat-high-score').innerText = `${highest}%`;
                document.getElementById('stat-total-completed').innerText = totalCompleted;
            } catch (e) {
                console.log("LocalStorage load error", e);
            }
        }

        function showHighScores() {
            playSound('click');
            const listContainer = document.getElementById('highscore-list');
            listContainer.innerHTML = '';

            try {
                const history = JSON.parse(localStorage.getItem('ai_quiz_scores') || '[]');
                if (history.length === 0) {
                    listContainer.innerHTML = `<p class="text-xs text-center text-slate-400 py-6">Belum ada rekor tersimpan. Ayo selesaikan quiz pertama kamu!</p>`;
                } else {
                    history.forEach((item, idx) => {
                        const row = document.createElement('div');
                        row.className = 'flex items-center justify-between p-3 rounded-xl bg-slate-800 border border-slate-700/60 text-xs';
                        row.innerHTML = `
                            <div class="flex items-center space-x-3">
                                <span class="w-6 h-6 rounded-lg bg-indigo-500/20 text-indigo-400 font-bold flex items-center justify-center">${idx + 1}</span>
                                <div>
                                    <div class="font-bold text-white">${item.score}% Skor (${item.correct}/35 Soal)</div>
                                    <div class="text-slate-400 text-[10px] uppercase">${item.mode} Mode &bull; ${item.date}</div>
                                </div>
                            </div>
                            <i class="fa-solid fa-award text-amber-400 text-base"></i>
                        `;
                        listContainer.appendChild(row);
                    });
                }
            } catch (e) {
                listContainer.innerHTML = `<p class="text-xs text-rose-400">Gagal memuat rekor.</p>`;
            }

            toggleModal('highscore-modal', true);
        }

        function clearHighScores() {
            playSound('click');
            localStorage.removeItem('ai_quiz_scores');
            localStorage.removeItem('ai_quiz_completed');
            updateWelcomeStats();
            showHighScores();
        }

        function toggleModal(id, show) {
            const modal = document.getElementById(id);
            if (show) modal.classList.remove('hidden');
            else modal.classList.add('hidden');
        }
    </script>
</body>
</html>
