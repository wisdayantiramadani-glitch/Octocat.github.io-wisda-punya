                        </p>
                    </div>
                    <div class="flex items-center text-xs font-semibold text-rose-400 group-hover:translate-x-1 transition-transform">
                        <span>Tantang Diri</span>
                        <i class="fa-solid fa-arrow-right ml-2"></i>
                    </div>
                </div>
            </div>
        </section>

        <!-- 2. QUIZ GAMEPLAY SCREEN -->
        <section id="quiz-screen" class="hidden space-y-6">
            <!-- Quiz HUD / Top Bar -->
            <div class="bg-slate-800 border border-slate-700 rounded-2xl p-4 flex flex-wrap items-center justify-between gap-4">
                <!-- Question Progress counter -->
                <div class="flex items-center space-x-3">
                    <span id="question-badge" class="px-3 py-1 text-xs font-bold bg-indigo-500/20 text-indigo-400 border border-indigo-500/30 rounded-lg">
                        Soal 1 / 35
                    </span>
                    <span id="category-badge" class="hidden sm:inline-block px-3 py-1 text-xs font-medium bg-slate-700 text-slate-300 rounded-lg">
                        Python Basics
                    </span>
                </div>

                <!-- Streak & Timer / Lives -->
                <div class="flex items-center space-x-4">
                    <!-- Lives (Survival Mode Only) -->
                    <div id="lives-container" class="hidden items-center space-x-1 text-rose-500 font-bold text-sm">
                        <i class="fa-solid fa-heart"></i>
                        <span id="lives-count">3</span>
                    </div>

                    <!-- Combo Streak -->
                    <div id="streak-container" class="hidden items-center space-x-1 text-amber-400 font-bold text-sm bg-amber-400/10 px-2.5 py-1 rounded-lg border border-amber-400/20">
                        <i class="fa-solid fa-fire text-amber-500 animate-bounce"></i>
                        <span>Streak x<span id="streak-count">0</span></span>
                    </div>

                    <!-- Timer (Exam Mode Only) -->
                    <div id="timer-container" class="hidden items-center space-x-2 text-cyan-400 font-mono font-bold text-sm bg-cyan-500/10 px-3 py-1 rounded-lg border border-cyan-500/20">
                        <i class="fa-solid fa-clock"></i>
                        <span id="timer-display">25:00</span>
                    </div>

                    <!-- Bookmark Question -->
                    <button id="bookmark-btn" onclick="toggleBookmarkCurrent()" class="p-2 text-slate-400 hover:text-amber-400 transition" title="Tandai soal ini">
                        <i class="fa-regular fa-bookmark text-lg" id="bookmark-icon"></i>
                    </button>
                </div>
            </div>

            <!-- Progress Bar -->
            <div class="w-full bg-slate-800 rounded-full h-2 overflow-hidden border border-slate-700/50">
                <div id="progress-bar" class="bg-gradient-to-r from-indigo-500 to-cyan-400 h-2 rounded-full transition-all duration-300 w-0"></div>
            </div>

            <!-- Question Card -->
            <div class="bg-slate-800/90 border border-slate-700/80 rounded-2xl p-6 md:p-8 space-y-6 shadow-xl">
                <!-- Question Text -->
                <div class="space-y-2">
                    <h3 id="question-text" class="text-xl md:text-2xl font-semibold text-white leading-relaxed">
                        Loading question...
                    </h3>
                </div>

                <!-- Multiple Choice Options Grid -->
                <div id="options-container" class="grid gap-3.5">
                    <!-- Options injected dynamically via JS -->
                </div>

                <!-- Practice Mode Explanation Box -->
                <div id="explanation-box" class="hidden p-4 rounded-xl border bg-slate-900/80 transition-all duration-300">
                    <div class="flex items-center space-x-2 font-bold mb-1" id="explanation-title">
                        <i id="explanation-icon" class="fa-solid"></i>
                        <span id="explanation-status">Jawaban Benar!</span>
                    </div>
                    <p id="explanation-text" class="text-slate-300 text-sm leading-relaxed">
                        Pembahasan soal akan muncul di sini.
                    </p>
                </div>
            </div>

            <!-- Navigation Controls & Navigator Grid Trigger -->
            <div class="flex items-center justify-between gap-4">
