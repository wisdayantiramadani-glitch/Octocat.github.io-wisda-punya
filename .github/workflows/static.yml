                </h2>
                <p class="text-slate-400 text-sm md:text-base leading-relaxed">
                    Uji pengetahuanmu seputar Python, Machine Learning, Deep Learning, Natural Language Processing, hingga Computer Vision dalam 35 soal pilihan ganda.
                </p>
            </div>

            <!-- Quiz Stats Overview Cards -->
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4 max-w-4xl mx-auto">
                <div class="bg-slate-800/60 border border-slate-700/60 rounded-xl p-4 text-center">
                    <div class="text-indigo-400 text-2xl font-bold mb-1">35</div>
                    <div class="text-xs text-slate-400 uppercase font-semibold">Total Soal</div>
                </div>
                <div class="bg-slate-800/60 border border-slate-700/60 rounded-xl p-4 text-center">
                    <div class="text-cyan-400 text-2xl font-bold mb-1">4</div>
                    <div class="text-xs text-slate-400 uppercase font-semibold">Topik AI</div>
                </div>
                <div class="bg-slate-800/60 border border-slate-700/60 rounded-xl p-4 text-center">
                    <div class="text-emerald-400 text-2xl font-bold mb-1" id="stat-high-score">0</div>
                    <div class="text-xs text-slate-400 uppercase font-semibold">Skor Tertinggi</div>
                </div>
                <div class="bg-slate-800/60 border border-slate-700/60 rounded-xl p-4 text-center">
                    <div class="text-amber-400 text-2xl font-bold mb-1" id="stat-total-completed">0</div>
                    <div class="text-xs text-slate-400 uppercase font-semibold">Selesai Dikerjakan</div>
                </div>
            </div>

            <!-- Game Mode Cards -->
            <div class="grid md:grid-cols-3 gap-6 max-w-4xl mx-auto">
                <!-- Practice Mode -->
                <div onclick="startQuiz('practice')" class="group relative bg-slate-800 hover:bg-slate-800/80 border border-slate-700 hover:border-indigo-500/50 rounded-2xl p-6 cursor-pointer transition-all duration-300 hover:-translate-y-1 hover:shadow-xl hover:shadow-indigo-500/10 flex flex-col justify-between">
                    <div>
                        <div class="w-12 h-12 rounded-xl bg-indigo-500/10 border border-indigo-500/30 text-indigo-400 flex items-center justify-center text-xl mb-4 group-hover:scale-110 transition-transform">
                            <i class="fa-solid fa-book-open"></i>
                        </div>
                        <h3 class="text-lg font-bold text-white mb-2">Mode Latihan</h3>
                        <p class="text-slate-400 text-xs leading-relaxed mb-4">
                            Tanpa batasan waktu. Penjelasan & pembahasan langsung muncul setelah kamu memilih jawaban.
                        </p>
                    </div>
                    <div class="flex items-center text-xs font-semibold text-indigo-400 group-hover:translate-x-1 transition-transform">
                        <span>Mulai Latihan</span>
                        <i class="fa-solid fa-arrow-right ml-2"></i>
                    </div>
                </div>

                <!-- Exam Mode -->
                <div onclick="startQuiz('exam')" class="group relative bg-slate-800 hover:bg-slate-800/80 border border-slate-700 hover:border-cyan-500/50 rounded-2xl p-6 cursor-pointer transition-all duration-300 hover:-translate-y-1 hover:shadow-xl hover:shadow-cyan-500/10 flex flex-col justify-between">
                    <div>
                        <div class="w-12 h-12 rounded-xl bg-cyan-500/10 border border-cyan-500/30 text-cyan-400 flex items-center justify-center text-xl mb-4 group-hover:scale-110 transition-transform">
                            <i class="fa-solid fa-stopwatch"></i>
                        </div>
                        <h3 class="text-lg font-bold text-white mb-2">Mode Simulasi Ujian</h3>
                        <p class="text-slate-400 text-xs leading-relaxed mb-4">
